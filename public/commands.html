<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DARK-DINU OFC // COMMAND REGISTRY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #050609;
      --card-bg: rgba(13, 16, 25, 0.85);
      --card-border: rgba(255, 45, 85, 0.22);
      --card-border-subtle: rgba(255, 255, 255, 0.08);
      --accent-pink: #ff2d55;
      --accent-pink-glow: rgba(255, 45, 85, 0.35);
      --accent-cyan: #00f0ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 60px; position: relative; }
    .ambient-glow { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); width: 500px; height: 350px; background: radial-gradient(circle, rgba(255, 45, 85, 0.2) 0%, transparent 70%); pointer-events: none; z-index: 0; filter: blur(50px); }

    .wrapper { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 10; }

    .nav-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--card-bg); border: 1px solid var(--card-border-subtle); border-radius: 18px; backdrop-filter: blur(16px); }
    .brand-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 800; font-size: 14px; }
    .brand-link img { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--accent-pink); }
    .btn-back { color: var(--text-muted); font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .btn-back:hover { color: #fff; }

    .search-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 22px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(16px); }
    .search-title { font-size: 16px; font-weight: 800; font-family: 'Space Grotesk'; color: #fff; margin-bottom: 6px; }
    .search-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

    .search-input-wrap { position: relative; }
    .search-input-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
    input[type="text"] { width: 100%; background: rgba(6, 7, 10, 0.85); border: 1px solid var(--card-border-subtle); border-radius: 14px; padding: 14px 16px 14px 44px; font-size: 14px; font-family: 'JetBrains Mono', monospace; color: #fff; outline: none; }
    input[type="text"]:focus { border-color: var(--accent-pink); box-shadow: 0 0 15px var(--accent-pink-glow); }

    .category-pills { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill { padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border-subtle); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .pill.active { background: var(--accent-pink); color: #fff; border-color: var(--accent-pink); }

    .commands-container { display: flex; flex-direction: column; gap: 10px; }
    .cmd-card { background: var(--card-bg); border: 1px solid var(--card-border-subtle); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; transition: 0.25s; }
    .cmd-card:hover { border-color: rgba(255, 45, 85, 0.4); transform: translateX(3px); }
    .cmd-head { display: flex; justify-content: space-between; align-items: center; }
    .cmd-name { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: var(--accent-cyan); }
    .cmd-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: rgba(255, 45, 85, 0.12); color: var(--accent-pink); }
    .cmd-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .cmd-aliases { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="wrapper">
    <div class="nav-header">
      <a class="brand-link" href="/">
        <img src="/logo.jpg" alt="Logo">
        <span>DARK-DINU COMMANDS</span>
      </a>
      <a class="btn-back" href="/"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>

    <div class="search-card">
      <div class="search-title">EXPLORE CAPABILITIES</div>
      <div class="search-desc">Search through active commands and built-in automation utilities.</div>
      
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Filter commands (e.g. setting, mode, pair)..." oninput="filterCommands()">
      </div>

      <div class="category-pills" id="categoryPills">
        <div class="pill active" onclick="setCategory('all')">ALL</div>
        <div class="pill" onclick="setCategory('general')">GENERAL</div>
        <div class="pill" onclick="setCategory('owner')">OWNER</div>
        <div class="pill" onclick="setCategory('tools')">TOOLS</div>
        <div class="pill" onclick="setCategory('ai')">AI & MEDIA</div>
      </div>
    </div>

    <div class="commands-container" id="cmdList">
      <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px;">Loading commands from memory...</div>
    </div>
  </div>

  <script>
    let allCommands = [];
    let currentCategory = 'all';

    async function loadCommands() {
      try {
        const res = await fetch('/api/commands');
        allCommands = await res.json();
        renderList(allCommands);
      } catch (err) {
        document.getElementById('cmdList').innerHTML = '<div style="text-align:center;color:var(--accent-pink);font-size:12px;padding:20px;">Failed to load commands live.</div>';
      }
    }

    function renderList(list) {
      const container = document.getElementById('cmdList');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:13px;padding:30px;">No matching commands found.</div>';
        return;
      }
      container.innerHTML = list.map(c => `
        <div class="cmd-card">
          <div class="cmd-head">
            <span class="cmd-name">.${c.name}</span>
            <span class="cmd-badge">${c.category || 'GENERAL'}</span>
          </div>
          <div class="cmd-desc">${c.description || 'No description provided.'}</div>
          ${c.aliases && c.aliases.length > 0 ? `<div class="cmd-aliases">Aliases: ${c.aliases.join(', ')}</div>` : ''}
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      filterCommands();
    }

    function filterCommands() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtered = allCommands;
      if (currentCategory !== 'all') {
        filtered = filtered.filter(c => (c.category || '').toLowerCase() === currentCategory);
      }
      if (q) {
        filtered = filtered.filter(c => 
          c.name.toLowerCase().includes(q) || 
          (c.description || '').toLowerCase().includes(q) ||
          (c.aliases || []).some(a => a.toLowerCase().includes(q))
        );
      }
      renderList(filtered);
    }

    loadCommands();
  </script>
</body>
</html>
